[project]
name = "canon"
version = "0.1.0"
description = "Universal clinical data normalization for AI agents"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2"]  # Postgres backend; Vercel installs from here, not requirements.txt

[project.optional-dependencies]
llm = ["anthropic>=1.11"]

[project.scripts]
canon = "canon.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canon*"]

[tool.setuptools.package-data]
canon = ["vocab/*.json", "dashboard.html"]
