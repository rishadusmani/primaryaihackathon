[project]
name = "clinical-normalizer"
version = "0.1.0"
description = "Canonical clinical data normalization (FHIR R4) for AI agents, billed per call via Stripe"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "stripe>=15",
    "httpx>=0.27",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["vocab/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
